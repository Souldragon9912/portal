<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass: rgba(22, 27, 34, 0.72);
      --bg-glass-card: rgba(33, 38, 45, 0.65);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --accent-glow: rgba(88, 166, 255, 0.35);
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0d1117 url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-image 0.3s ease;
    }

    /* Top Utility Bar */
    header {
      width: 100%;
      max-width: 1480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      padding: 14px 24px;
      border-radius: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      max-width: 640px;
    }

    .search-box select {
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    .search-box input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-glass);
      padding: 10px 18px;
      border-radius: 10px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .header-actions button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }

    .header-actions button:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Main Grid Layout */
    .dashboard-grid {
      width: 100%;
      max-width: 1480px;
      display: grid;
      grid-template-columns: 1.1fr 1fr 1.1fr;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 1100px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 12px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-btn {
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--accent);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .badge-btn:hover {
      background: rgba(88, 166, 255, 0.15);
    }

    /* Speed Dials Grid */
    .speed-dial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 14px;
    }

    .dial-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }

    .dial-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    .dial-card img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    /* Self-Hosted Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    .service-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.2s, border-color 0.2s;
    }

    .service-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .service-card .status-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #3fb950;
    }

    .service-card .name {
      font-size: 14px;
      font-weight: 600;
    }

    .service-card .desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Bookmarks Drawer */
    .bookmark-input-group {
      display: flex;
      gap: 8px;
    }

    .bookmark-input-group input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .bookmarks-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .bookmark-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      padding: 10px 14px;
      border-radius: 10px;
    }

    .bookmark-item a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }

    .bookmark-item a:hover {
      color: var(--accent);
    }

    .bookmark-item button {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
    }

    /* Google Calendar Embed Container */
    .calendar-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 480px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-glass);
      background: rgba(0, 0, 0, 0.25);
    }

    .calendar-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: #161b22;
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-content h3 {
      font-size: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-group input {
      background: #0d1117;
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .modal-footer button {
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-main);
    }

    .btn-primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <form class="search-box" id="search-form">
      <select id="engine-select">
        <option value="https://www.google.com/search?q=">Google</option>
        <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
        <option value="https://www.bing.com/search?q=">Bing</option>
      </select>
      <input type="text" id="search-input" placeholder="Search the web, paste URL, or enter local IP..." autocomplete="off" />
    </form>
    <div class="header-actions">
      <button onclick="openSettingsModal()">⚙ Settings</button>
    </div>
  </header>

  <main class="dashboard-grid">
    
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">⚡ Speed Dials</span>
        <button class="badge-btn" onclick="openAddDialModal()">+ Add</button>
      </div>
      <div class="speed-dial-grid" id="speed-dials-container"></div>

      <div class="panel-header" style="margin-top: 16px;">
        <span class="panel-title">📑 Read Later & Tabs</span>
      </div>
      <div class="bookmark-input-group">
        <input type="text" id="bm-title" placeholder="Title / Site name..." />
        <input type="url" id="bm-url" placeholder="https://..." />
        <button class="badge-btn" onclick="addBookmark()">Save</button>
      </div>
      <ul class="bookmarks-list" id="bookmarks-container"></ul>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">🖥 Self-Hosted Stack & Hub</span>
        <button class="badge-btn" onclick="openAddServiceModal()">+ Service</button>
      </div>
      <div class="services-grid" id="services-container"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📅 Google Calendar</span>
        <button class="badge-btn" onclick="openSettingsModal()">Sync / Setup</button>
      </div>
      <div class="calendar-container">
        <iframe id="calendar-frame" src="" loading="lazy"></iframe>
      </div>
    </div>

  </main>

  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h3>Dashboard Settings</h3>
      <div class="form-group">
        <label>Custom Wallpaper URL (Image or Direct GIF link)</label>
        <input type="url" id="settings-wallpaper" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label>Google Calendar Embed URL</label>
        <input type="text" id="settings-calendar" placeholder="https://calendar.google.com/calendar/embed?src=..." />
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('settings-modal')">Cancel</button>
        <button class="btn-primary" onclick="saveSettings()">Save Configuration</button>
      </div>
    </div>
  </div>

  <div class="modal" id="dial-modal">
    <div class="modal-content">
      <h3>Add Speed Dial</h3>
      <div class="form-group">
        <label>Label</label>
        <input type="text" id="dial-title" placeholder="YouTube, GitHub, etc." />
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="url" id="dial-url" placeholder="https://..." />
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('dial-modal')">Cancel</button>
        <button class="btn-primary" onclick="saveNewDial()">Add Link</button>
      </div>
    </div>
  </div>

  <div class="modal" id="service-modal">
    <div class="modal-content">
      <h3>Add Self-Hosted Service</h3>
      <div class="form-group">
        <label>Service Name</label>
        <input type="text" id="srv-name" placeholder="Immich, Plex, Portainer..." />
      </div>
      <div class="form-group">
        <label>Subtitle / Role</label>
        <input type="text" id="srv-desc" placeholder="Photo Storage, Media Server..." />
      </div>
      <div class="form-group">
        <label>Direct LAN / Tailscale URL</label>
        <input type="url" id="srv-url" placeholder="http://192.168.1.50:2283" />
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('service-modal')">Cancel</button>
        <button class="btn-primary" onclick="saveNewService()">Add Service</button>
      </div>
    </div>
  </div>

  <script>
    // --- State Storage Defaults ---
    const defaultDials = [
      { name: 'GitHub', url: 'https://github.com' },
      { name: 'YouTube', url: 'https://youtube.com' },
      { name: 'Reddit', url: 'https://reddit.com' },
      { name: 'Facebook', url: 'https://facebook.com' }
    ];

    const defaultServices = [
      { name: 'Immich', desc: 'Photos & Backups', url: 'http://localhost:2283' },
      { name: 'Plex', desc: 'Media Server', url: 'http://localhost:32400' },
      { name: 'Portainer', desc: 'Docker Management', url: 'http://localhost:9000' },
      { name: 'Tailscale', desc: 'Mesh VPN Console', url: 'https://login.tailscale.com/admin' }
    ];

    let state = {
      wallpaper: localStorage.getItem('dash_wallpaper') || 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070',
      calendarUrl: localStorage.getItem('dash_calendar') || '',
      dials: JSON.parse(localStorage.getItem('dash_dials')) || defaultDials,
      bookmarks: JSON.parse(localStorage.getItem('dash_bookmarks')) || [],
      services: JSON.parse(localStorage.getItem('dash_services')) || defaultServices
    };

    // --- Search Handling ---
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (query.startsWith('http://') || query.startsWith('https://')) {
        window.location.href = query;
      } else if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(query)) {
        window.location.href = 'http://' + query;
      } else {
        const engine = document.getElementById('engine-select').value;
        window.location.href = engine + encodeURIComponent(query);
      }
    });

    // --- Render Functions ---
    function renderDials() {
      const container = document.getElementById('speed-dials-container');
      container.innerHTML = state.dials.map((dial, idx) => {
        const domain = new URL(dial.url).hostname;
        return `
          <a href="${dial.url}" class="dial-card" target="_blank" rel="noopener">
            <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="${dial.name}" />
            <span>${dial.name}</span>
          </a>
        `;
      }).join('');
    }

    function renderBookmarks() {
      const container = document.getElementById('bookmarks-container');
      if (state.bookmarks.length === 0) {
        container.innerHTML = '<li style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px;">No saved tabs yet.</li>';
        return;
      }
      container.innerHTML = state.bookmarks.map((bm, idx) => `
        <li class="bookmark-item">
          <a href="${bm.url}" target="_blank" rel="noopener">${bm.title}</a>
          <button onclick="removeBookmark(${idx})">&times;</button>
        </li>
      `).join('');
    }

    function renderServices() {
      const container = document.getElementById('services-container');
      container.innerHTML = state.services.map(srv => `
        <a href="${srv.url}" class="service-card" target="_blank" rel="noopener">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="name">${srv.name}</span>
            <span class="status-dot"></span>
          </div>
          <span class="desc">${srv.desc}</span>
        </a>
      `).join('');
    }

    function applySettings() {
      document.body.style.backgroundImage = `url('${state.wallpaper}')`;
      const calFrame = document.getElementById('calendar-frame');
      if (state.calendarUrl) {
        calFrame.src = state.calendarUrl;
      } else {
        calFrame.srcdoc = `
          <body style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:90vh; color:#8b949e; font-family:sans-serif; text-align:center; padding: 20px;">
            <p><strong>Google Calendar Not Linked</strong></p>
            <p style="font-size:13px; margin-top:8px;">Open Calendar Settings, copy your public/shared embed URL, and paste it into Settings.</p>
          </body>
        `;
      }
    }

    // --- Bookmarks Logic ---
    function addBookmark() {
      const titleInput = document.getElementById('bm-title');
      const urlInput = document.getElementById('bm-url');
      const title = titleInput.value.trim();
      let url = urlInput.value.trim();

      if (!title || !url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      state.bookmarks.unshift({ title, url });
      localStorage.setItem('dash_bookmarks', JSON.stringify(state.bookmarks));
      titleInput.value = '';
      urlInput.value = '';
      renderBookmarks();
    }

    function removeBookmark(idx) {
      state.bookmarks.splice(idx, 1);
      localStorage.setItem('dash_bookmarks', JSON.stringify(state.bookmarks));
      renderBookmarks();
    }

    // --- Modals & Saves ---
    function openSettingsModal() {
      document.getElementById('settings-wallpaper').value = state.wallpaper;
      document.getElementById('settings-calendar').value = state.calendarUrl;
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function openAddDialModal() {
      document.getElementById('dial-modal').style.display = 'flex';
    }

    function openAddServiceModal() {
      document.getElementById('service-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function saveSettings() {
      const wp = document.getElementById('settings-wallpaper').value.trim();
      const cal = document.getElementById('settings-calendar').value.trim();
      if (wp) {
        state.wallpaper = wp;
        localStorage.setItem('dash_wallpaper', wp);
      }
      state.calendarUrl = cal;
      localStorage.setItem('dash_calendar', cal);
      applySettings();
      closeModal('settings-modal');
    }

    function saveNewDial() {
      const name = document.getElementById('dial-title').value.trim();
      let url = document.getElementById('dial-url').value.trim();
      if (!name || !url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

      state.dials.push({ name, url });
      localStorage.setItem('dash_dials', JSON.stringify(state.dials));
      renderDials();
      closeModal('dial-modal');
    }

    function saveNewService() {
      const name = document.getElementById('srv-name').value.trim();
      const desc = document.getElementById('srv-desc').value.trim();
      const url = document.getElementById('srv-url').value.trim();
      if (!name || !url) return;

      state.services.push({ name, desc, url });
      localStorage.setItem('dash_services', JSON.stringify(state.services));
      renderServices();
      closeModal('service-modal');
    }

    //
