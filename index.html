<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Dial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-glass: rgba(22, 27, 34, 0.75);
      --bg-glass-card: rgba(33, 38, 45, 0.65);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --accent-glow: rgba(88, 166, 255, 0.35);
      --danger: #f85149;
      
      /* Default Animated Border Colors (Google) */
      --se-c1: #4285F4; 
      --se-c2: #EA4335; 
      --se-c3: #FBBC05; 
      --se-c4: #34A853;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0d1117 url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-image 0.3s ease;
      overflow-x: hidden;
    }

    /* Top Bar */
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      padding: 14px 24px;
      border-radius: 16px;
    }

    .widget-toggles {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Central Search & Animated Border */
    .hero-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .search-box-wrapper {
      position: relative;
      padding: 2px; /* Border thickness */
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .search-box-wrapper::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      height: 300%;
      background: conic-gradient(var(--se-c1), var(--se-c2), var(--se-c3), var(--se-c4), var(--se-c1));
      transform: translate(-50%, -50%) rotate(0deg);
      animation: spin-border 4s linear infinite;
      z-index: 0;
    }

    @keyframes spin-border {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .search-box {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      gap: 10px;
      background: rgba(18, 22, 28, 0.95);
      padding: 8px;
      border-radius: 14px;
    }

    .search-box select {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    .search-box input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      padding: 12px 18px;
      border-radius: 10px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: background 0.2s;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Content Panels */
    .main-panel {
      width: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 12px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
    }

    .badge-btn {
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--accent);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .badge-btn:hover {
      background: rgba(88, 166, 255, 0.15);
    }

    /* Speed Dials Grid */
    .speed-dial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }

    .dial-card-wrapper {
      position: relative;
    }

    .dial-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .dial-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .dial-card img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }

    .card-delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: var(--text-muted);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      transition: color 0.2s, background 0.2s;
    }

    .dial-card-wrapper:hover .card-delete-btn,
    .service-card-wrapper:hover .card-delete-btn {
      display: flex;
    }

    .card-delete-btn:hover {
      color: var(--danger);
      background: rgba(248, 81, 73, 0.2);
    }

    /* Self-Hosted Stack Grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .service-card-wrapper {
      position: relative;
    }

    .service-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.2s, border-color 0.2s;
      width: 100%;
    }

    .service-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .service-card .status-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #3fb950;
    }

    .service-card .name {
      font-size: 14px;
      font-weight: 600;
    }

    .service-card .desc {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Slide-out Drawers */
    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 440px;
      max-width: 90vw;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-glass);
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.6);
      z-index: 100;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-right {
      right: 0;
      transform: translateX(100%);
    }

    .drawer-right.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 12px;
    }

    .drawer-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
    }

    .drawer-close:hover {
      color: var(--text-main);
    }

    /* Google Calendar Auth & Events UI */
    .cal-auth-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 40px 16px;
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
    }

    .events-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cal-event-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s;
    }

    .cal-event-card:hover {
      border-color: var(--accent);
    }

    .cal-event-title {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }

    .cal-event-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--accent);
    }

    /* Bookmarks Drawer */
    .bookmark-input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bookmark-input-group input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .bookmarks-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .bookmark-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .bookmark-item a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }

    .bookmark-item a:hover {
      color: var(--accent);
    }

    .bookmark-item button {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-content {
      background: #161b22;
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      width: 90%;
      max-width: 540px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-group input {
      background: #0d1117;
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 10px 14px
